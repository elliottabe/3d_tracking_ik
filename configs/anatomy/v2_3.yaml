# Anatomy config for the v2_3 body model (`fruitfly_v2.3` + Task 10's
# derived, adhesion-free `fruitfly_v2_3_ik/`, both in the SIBLING
# `fruitfly_body_models` checkout -- unlike v1, this model lives OUTSIDE this
# repo).
#
# DERIVED from the source repo's own `configs/anatomy/v2_3.yaml`
# (`3d_tracking_dataset`), but every name list below was RE-verified here
# (2026-09-13, MuJoCo, against the ACTUAL compiled
# `fruitfly_v2_3_ik/fruitfly_v2_3_ik.xml`) rather than copied on the
# assumption the source repo's own verification still applies to this
# checkout's build of the model -- see `.superpowers/sdd/
# 2026-09-13-driver-slurm-parity/task-10-report.md` for the check itself.
# Result: `end_eff_names` (6), `body_names` (54), `joint_names` (56),
# `wing_names` (6), `model.KP_NAMES` (50) and `model.KEYPOINT_MODEL_PAIRS`
# values (50 bodies) are ALL already present in the model -- ZERO dropped.
# Nothing here is a curated subset the way v1's `body_names`/`joint_names`
# are; v2_3's XML happens to define exactly this set (see the source
# config's own per-block comments for which head/antenna/mouthpart joints
# and which extra tarsus/haltere/trochanter bodies exist but are
# deliberately left out, carried over unchanged since the XML agrees).
#
# `cse_mesh_npz` is dropped entirely, matching v1.yaml's own decision:
# DensePose/CSE is an explicit spec non-goal in this port.
#
# `model.SITES_TO_FREEZE` is NOT carried over from `v1.yaml`. v1's freeze list
# (the four wing-vein sites) came from a MEASURED drift specific to v1's own
# geometry (v1.yaml's comment: "WingR_V12's offset drifted 3.2x the wing's
# own half-thickness"); nothing analogous has been measured for v2_3's wing
# mesh, and copying the list would assert a measurement that was never made
# on this model. Leave it empty (the schema default) until it is.
name: v2_3

# Skeleton-structural default: keypoints excluded from the Procrustes
# alignment fit (glob patterns over keypoint names). Wing-vein markers
# (V12/V13) move too fast to be reliable for the rigid fit -- same rationale
# as v1.yaml, unrelated to the body model itself.
alignment_exclude: ["*_V12", "*_V13"]

# OUTSIDE this repo, unlike v1's in-repo `${repo_root:}/model`: the derived
# v2_3_ik model lives in the SIBLING `fruitfly_body_models` checkout
# (`scripts/build_v2_3_model.py` writes it there, beside its read-only
# source). Expressed via the bare `${repo_root:}` resolver -- NEVER
# `${paths.body_model_dir}` or any other `${paths.*}` reference -- for the
# same reason v1's own `root` is a bare resolver call and not a config-tree
# reference: `tracking.run._load_anatomy` DETACHES `cfg.anatomy` into a
# standalone `OmegaConf` node before calling `load_anatomy` (round-tripping
# through `to_container(resolve=False)` + `OmegaConf.create`, because v1's
# `root: ${repo_root:}/model` bare self-reference needs a standalone root to
# resolve -- see that function's own docstring). A detached node carries NO
# `paths` key at all, so a `${paths.body_model_dir}`-style interpolation here
# would resolve fine in a smoke test that composes the full pipeline config
# and reads `cfg.anatomy` while it is still ATTACHED to that tree (exactly
# what looks like "it works" in a first check) and then raise
# `InterpolationResolutionError` the FIRST time `python -m tracking.run
# anatomy=v2_3` actually calls `_load_anatomy` -- passing every test that
# never detaches while failing the one real caller that matters. `repo_root`
# is a bare custom resolver (registered once, at import, independent of any
# config tree), so it resolves identically attached or detached -- exactly
# the property v1's own `root` needs and has.
root: ${repo_root:}/../fruitfly_body_models/fruitfly_v2_3_ik
mjcf_path: "${root}/fruitfly_v2_3_ik.xml"
arena_path: "${root}/floor.xml"

end_eff_names:
  # v2_3 uses "tarsal_claw", not v1's "claw" -- all 6 verified as real XML
  # bodies (unlike v1's `end_eff_names` comment, there is no v1-style
  # "claw_T1_left" body here at all; the joint of the same name also exists
  # but is not referenced from this list, which names BODIES).
  - tarsal_claw_T1_left
  - tarsal_claw_T1_right
  - tarsal_claw_T2_left
  - tarsal_claw_T2_right
  - tarsal_claw_T3_left
  - tarsal_claw_T3_right

# All 54 verified as real XML bodies (v2_3 has a `trochanter` body per leg
# that v1 does not, and splits the tarsus into tarsus1-4 + tarsal_claw where
# v1 has tarsus/tarsus2/tarsus3/tarsus4/claw -- 9 bodies/leg x 6 legs).
