[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracking"
description = "Mask-free multi-camera fly tracking to articulated IK fits."
authors = [{ name = "Elliott Abe", email = "eabe@uw.edu" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "hydra-core", "omegaconf", "numpy", "pandas", "h5py", "tqdm",
    "opencv-python-headless", "imageio", "imageio-ffmpeg", "scipy",
    # matplotlib: the kp-video's 3D world panel. It was previously an
    # UNDECLARED dependency -- installed, imported by four scripts/viz tools,
    # and never listed -- so a clean install would have failed on them.
    "matplotlib",
    "jax[cuda12]", "flax", "optax", "orbax-checkpoint",
    "mujoco", "mujoco-mjx",
    "huggingface_hub", "safetensors",
    # `pip install jaxls` resolves to an UNRELATED PyPI package of the same
    # name (2024.0.1), which imports `jax.core.JaxprEqn` and dies on any
    # modern jax. The IK solver needs brentyi/jaxls, which publishes no
    # wheel, so it is pinned here by commit -- the same commit the source
    # repo's environment was built from.
    "jaxls @ git+https://github.com/brentyi/jaxls.git@5f766d3b09364a96d83497de2325a835d0e23dc4",
    "jaxlie", "jax_dataclasses", "termcolor",
    # PyYAML: read directly by scripts/viz/filter_rigidity_check.py and by the
    # Figure 4 notebook's anatomy-config loader. Same class of defect as the
    # matplotlib note above -- it was satisfied only transitively (flax,
    # omegaconf, huggingface_hub all pull it in), so a resolver change could
    # have dropped it out from under code that imports it by name.
    "PyYAML",
]

[project.optional-dependencies]
dev = ["ruff"]
# Notebook_figures/Figure_4 only; the pipeline in src/ needs neither. Kept out
# of the core list so a pipeline install does not pay for them.
figures = [
    # scikit-learn: the Pslow/Pfast pulse classifier (PCA + GaussianMixture)
    # behind Figure 4's panel F, and Figures 2 and 5c-d.
    "scikit-learn",
    # seaborn: Figures 2, 3, 5a-b and 5c-d.
    "seaborn",
    # scikit-image: Figure 5f.
    "scikit-image",
    # cuml/cupy are deliberately NOT here; see the `rapids` extra below.
    # mujoco_visualizer: the styled two-fly render behind panel H. Not on
    # PyPI, so it is pinned by commit the way jaxls is -- and pinned rather
    # than tracking main because the panel's appearance depends on its
    # `Earthy_V1_courtship_fly0/fly1` presets. Bump the sha deliberately, and
    # re-read panel H afterwards. A local editable checkout still wins for
    # development.
    "mujoco_visualizer @ git+https://github.com/elliottabe/mujoco_visualizer.git@47aab238fb34eb07b58d21dcf20342171c4e6ba0",
]
# Optional GPU acceleration for Figure 2's embedding. Figure 2 imports these
# inside a try/except and falls back to scikit-learn, so the figure is
# reproducible without them; they only make it faster.
#
# Needs NVIDIA's index, which an extra cannot carry, so this will NOT resolve
# from `pip install ".[rapids]"` alone:
#
#   uv pip install --extra-index-url=https://pypi.nvidia.com ".[rapids]"
#
# Measured before adding: installing these into the pipeline environment
# DOWNGRADES numpy 2.5.3 -> 2.4.6 and pandas 3.0.5 -> 3.0.3, because cudf
# pins them. numpy is the version the JAX and MuJoCo stack is tested against,
# so prefer a separate environment for Figure 2 over perturbing this one.
# cu12 wheels: correct for the `cuda-version >=12.2,<=12.9` this env pins.
rapids = [
    "cupy-cuda12x",
    "cuml-cu12",
]

[tool.hatch.metadata]
# Two dependencies are git URLs rather than PyPI names -- jaxls (whose PyPI
# name is taken by an unrelated package) and mujoco_visualizer (not published).
# Hatchling refuses direct references without this, so `pip wheel .` failed on
# the jaxls line long before the second one was added.
allow-direct-references = true

[tool.hatch.version]
path = "src/tracking/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tracking"]

[tool.ruff]
line-length = 100
src = ["src"]
# Markdown is excluded from FORMATTING only (ruff >=0.16 formats python blocks
# inside .md); the code that matters lives in real files, which ruff checks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]
