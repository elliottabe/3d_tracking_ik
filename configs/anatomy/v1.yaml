# ===========================================================================
# STAC model definition (ported from stac-mjx so the main configs are the
# single source of truth). Defines the keypoint<->body mapping and IK solver
# parameters Plan B's IK consumes. Copied AS-IS from the source repo --
# verified 100% present against the XML (model.KP_NAMES: 50/50 have an
# `aligned[<name>]` site; model.KEYPOINT_MODEL_PAIRS: all 50 targets are
# real XML bodies).
# ===========================================================================
model:
  MJCF_PATH: ${anatomy.mjcf_path}
  name: 'fruitfly_V1_'

  # Per-segment (per-limb) SHAPE calibration for courtship.
  #
  # OFF, AND IT STAYS OFF UNLESS SOMEONE TURNS IT ON DELIBERATELY (user
  # decision, 2026-08-31). The objection is structural, not empirical: this
  # morphs every calibratable segment by its own free scale factor, an
  # unbounded change to the body model with nothing holding the result near a
  # real fly. A better reprojection number bought that way is not evidence the
  # anatomy got better -- it is the same failure mode as marker offsets
  # absorbing a 38x body-scale error. Body size belongs in the ONE trunk scale
  # (scale.json, per fly per recording); shape does not belong to the fitter.
  # run_bout warns loudly if it is ever enabled. A single global trunk
  # scale + STAC marker offsets leaves a per-limb proportion mismatch (model femur
  # too long, tarsus too short) so the IK can't reach the keypoints. When true,
  # run_bout computes per-segment scales ONCE per session (Adam MJX
  # M-step), persists them to <run_root>/segment_scales.json, and sets
  # cfg.model.SEGMENT_SCALES so stac_mjx morphs the model before fitting offsets
  # and running IK (halves the IK site-error). Set false to disable.
  # Benchmark 2026-08-08: segment_calibration OFF was better-or-equal on
  # every cohort (free-running, courtship-male, courtship-female; both the
  # apart and close-interaction splits), so it stays off. Regenerate the
  # comparison with scripts/benchmark/run_variant.py -- the scorecards it
  # writes are untracked artifacts, not files in the repo.
  #
  # 2026-08-31: THAT VERDICT IS VOID -- do not cite it. The benchmark scores
  # outputs.h5's kp3d_mm (scripts/benchmark/metrics.py), which comes from
  # Stage-E FK via ik_solve.build_solver_inputs -- and until
  # commit 6044d28 that rebuilt the FK model from the XML alone, never
  # applying SEGMENT_SCALES. So the ON arm solved qpos against the MORPHED
  # skeleton and was then scored on the UNMORPHED one. The ON arm was
  # measuring a qpos/skeleton mismatch, not per-segment calibration, and
  # "OFF was better" is what a broken ON arm looks like. Re-run the A/B
  # before drawing any conclusion.
  #
  # STILL BROKEN for a segment-calibrated run: outputs.h5's mesh_mm (and
  # every mesh render built on it) comes from
  # fk.load_anatomy, which does MjModel.from_xml_path + the mesh
  # npz's vertices_local -- neither morphed. So kp3d_mm is now morphed while
  # mesh_mm is not, and a sidebyside of a segment-calibrated run will show
  # fitted markers detaching from the mesh as an ARTIFACT. Fix that before
  # reading any mesh figure of an ON run.
  #
  # Independently measured 2026-08-31 (pooled quality-gated male fit, 20
  # bouts): IK site-error 0.0077 -> 0.0069 model-units (~10%, not the
  # "halves the error" this comment claims above), and the trunk-vs-leg
  # disagreement it was meant to close went 12.26% -> 12.65%, i.e. slightly
  # WORSE -- the 3 thorax-plate pairs are not in build_segment_map's
  # calibratable set at all, so no leg calibration can reach them.
  segment_calibration: false

  N_FRAMES_PER_CLIP: 500 # 1000 environments

  # Tolerance for the optimizations of the full model, limb, and root.
  # TODO: Re-implement optimizer loops to use these tolerances
  FTOL: 5.0e-03
  ROOT_FTOL: 1.0e-05
  LIMB_FTOL: 1.0e-06

  # Number of alternating pose and offset optimization rounds.
  N_ITERS: 6
