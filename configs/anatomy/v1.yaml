  SITES_TO_REGULARIZE:
    # Head markers (Antenna_Base/EyeL/EyeR) and Abd_A4 were removed: this fly's
    # head sits ~17% further from the thorax than the v1 model's, and Abd_A4
    # under-reaches. Regularizing them pinned fit_offsets to the wrong (model)
    # proportions, leaving the head markers floating past the head. Freeing them
    # lets fit_offsets extend those sites out to the markers. Keep the fast /
    # occluded markers (wing veins, tarsal tips, ThxCx) and the trunk anchors
    # (Scutellum, Abd_tip) regularized.
    - Scutellum
    - WingL_base
    - WingR_base
    - Abd_tip
    - T1L_ThxCx
    - T1R_ThxCx
    - T1L_TaTip
    - T2L_TaTip
    - T3L_TaTip
    - T1R_TaTip
    - T2R_TaTip
    - T3R_TaTip

  RENDER_FPS: 50

  N_SAMPLE_FRAMES: 100

  # If you have reason to believe that the initial offsets are correct for particular keypoints,
  # you can regularize those sites using _SITES_TO_REGULARIZE.
  M_REG_COEF: 10.0

  # Optimizer for the OFFSETS solve only (the pose solve is jaxls, untouched).
  # "sgd" (default) is the source-exact optax.sgd(5e-4, momentum=0.9) that every
  # offsets parity gate is calibrated against. "adam" is scale-invariant, which
  # matters because m_loss's gradient scales linearly with M_REG_COEF: measured
  # on bout 28 fly1, M_REG_COEF of 100 and 1000 DIVERGE under sgd (they now raise
  # instead of silently returning NaN offsets) while 0, 1 and 10 converge.
  # Switching this changes the fitted offsets and breaks source parity.
  # M_OPTIMIZER: adam
  # M_LEARNING_RATE: 1.0e-3

  # Sites whose offset is NEVER optimised -- held at the MJCF's own site
  # position. This is the LIMIT of SITES_TO_REGULARIZE: no coefficient to tune
  # and no way to diverge. Use it where the model's site position is anatomy you
  # trust more than a per-individual fit.
  #
  # Measured motivation (bout 28 fly1): unregularized, WingR_V12's offset drifted
  # 3.2x the wing's own half-thickness PERPENDICULAR to the wing surface -- the
  # marker left the wing. The solve then rotates the wing about its long axis to
  # reach it, which renders as a twisted wing that no keypoint residual can see,
  # because the three wing markers are nearly collinear ALONG that axis (15 deg
  # of wing pitch moves them 1.9 px, vs 38 px for the same roll). M_REG_COEF=10
  # brought it back inside the wing; freezing removes the question entirely.
  #
  # A name here that is not a keypoint of this anatomy is ignored with a message
  # (filter_anatomy leaves these lists intact when it drops keypoints). A site in
  # both this list and SITES_TO_REGULARIZE is frozen, and says so on stderr.
  SITES_TO_FREEZE: 
    - WingL_V12
    - WingL_V13
    - WingR_V12
    - WingR_V13

  # Per-joint L2 regularization toward rest pose (q=0) applied during pose optimization.
  # Helps multi-axis joints avoid degenerate solutions. Each coxa has 3 HINGE DOFs
  # (extension, flexion, twist); all three must be regularized or the free DOFs compensate.
  # Keys are joint names from the MJCF; values are L2 regularization coefficients.
  # Unspecified joints default to 0.0 (no regularization).
  #
  # NOTE: this option is now wired up (Stac.__init__ builds q_reg_weights from it).
  # Empty = no regularization (default).
  #
  # We tried regularizing wing_roll toward 0 to lay the wings flat, but it BACKFIRED:
  # (1) a weight of 1.0 dominated the loss and degraded the whole fit (legs/abdomen),
  # and (2) the wing roll is NOT actually unconstrained -- the well-tracked WingL/R_V12
  # vein consistently (std 0.06 rad) places the wing at ~0.9 rad (~52deg) roll; forcing
  # roll=0 raised the V12 residual 6%->14%. So the data genuinely wants the rolled wing
  # (likely a systematic model-V12-site vs tracker-V12-vein mismatch). Don't regularize
  # roll to force flat wings -- fix the V12 site placement instead. Leaving empty.
  JOINT_REG_WEIGHTS: {}

  # Fixed step size for the ProjectedGradient q optimizer.
  # stepsize > 0 disables Armijo/FISTA line search (a nested while_loop that does
  # up to 30 extra kinematics evaluations per gradient step -- very slow inside
  # jax.lax.scan). A fixed step gives ~30x fewer evaluations per iteration.
  # Set to 0.0 to restore line search (accurate but slow). Tune if quality degrades.
  STEPSIZE_Q: 0.0

  # --- Jaxls batch Levenberg-Marquardt IK solver ---
  # Set USE_JAXLS=True to solve all frames simultaneously via jaxls LM
  # instead of per-frame ProjectedGradient.
  USE_JAXLS: True
  JAXLS_LAMBDA_INITIAL: 1.0
  # jaxls termination tolerances, made explicit rather than left on jaxls'
  # own defaults. Gradient and parameter are TIGHTENED relative to jaxls'
  # defaults (gradient 1e-4, parameter 1e-6); cost is left AT jaxls' own
  # default (1e-5). A 23% residual improvement was measured on the
  # explainer's truncated single-`pose_optimization` path
  # (Session6/2025_10_12_15_06_46, not the production `fit_offsets` path) and
  # has NOT been reproduced there.
  JAXLS_GRADIENT_TOLERANCE: 1.0e-8
  JAXLS_PARAMETER_TOLERANCE: 1.0e-10
  # jaxls cost tolerance (relative |cost change| / cost per LM iteration).
  # TIGHTENED 2026-09-05 from jaxls' default 1e-5: the cost criterion was the
  # one firing in every instrumented solve, and it stopped the batch solve
  # while the weakly-observed wing-pitch DOF was still 30 deg from its marker
  # optimum (Session0/2025_10_20_13_20_04 bout 28 fly1: folded wing rendered
  # edge-on at -19 deg where the marker cost minimum is -50 deg). With cost
  # 1e-12 / grad 1e-14 / param 1e-16 the 300-frame window reached -49 deg and
  # 0.41 -> 0.36 mm all-keypoint residual at ~6x solve time; this setting
  # tightens ONLY the cost criterion and keeps N_ITER_Q, as the cheaper
  # first step.
  # FTOL is NOT mapped here: it is 5.0e-03 and governs the ProjectedGradient
  # path only.
  JAXLS_COST_TOLERANCE: 1.0e-10
  # DEAD on both surviving paths, and looks alive -- measured from the
  # reference run's own stored configs (2026-09-11): the offsets fit ran with
  # 0.0, because preprocess.offsets.offsets_fit_cfg overwrites this key (the
  # fit sample is non-consecutive frames, so coupling them would be wrong);
  # the per-frame solve ran with this file still saying 0.005 while
  # solve_per_frame_ik passes smooth_weight=0.0 to the solver explicitly and
  # never reads this key at all. Tuning this number changes nothing on either
  # path -- do not treat a change here as having done anything.
  JAXLS_SMOOTH_WEIGHT: 0.005
  JAXLS_LINEAR_SOLVER: "auto"
  JAXLS_USE_SE3_ROOT: true
  JAXLS_CHUNK_SIZE: 0  # JAXLS_CHUNK_SIZE > 0 solves in chunks of frames to reduce memory usage at the cost of speed.
  JAXLS_ORIENTATION_KEYPOINTS:
    rear: Scutellum
    left: WingL_base
    right: WingR_base
    front: Antenna_Base

  # Per-keypoint weights for the IK loss. Higher weights on proximal leg
  # keypoints counteract the leverage bias where distal keypoints dominate
  # due to larger positional errors for the same angular error.
  # Proximal (ThxCx, Tro): 2.0, Mid (FeTi, TiTa): 1.0, Distal (TaT1, TaT3, TaTip): 0.5
  KEYPOINT_WEIGHTS: {}
    # Scutellum: 1.0
    # WingL_base: 1.0
    # WingR_base: 1.0
    # Antenna_Base: 1.0
    # EyeL: 1.0
    # EyeR: 1.0
    # WingL_V12: 1.0
    # WingL_V13: 1.0
    # WingR_V12: 1.0
    # WingR_V13: 1.0
    # Abd_A4: 1.0
    # Abd_tip: 1.0
    # T1L_ThxCx: 2.0
    # T1L_Tro: 2.0
    # T1L_FeTi: 1.0
    # T1L_TiTa: 1.0
    # T1L_TaT1: 0.5
    # T1L_TaT3: 0.5
    # T1L_TaTip: 0.5
    # T1R_ThxCx: 2.0
    # T1R_Tro: 2.0
    # T1R_FeTi: 1.0
    # T1R_TiTa: 1.0
    # T1R_TaT1: 0.5
    # T1R_TaT3: 0.5
    # T1R_TaTip: 0.5
    # T2L_Tro: 2.0
    # T2L_FeTi: 1.0
    # T2L_TiTa: 1.0
    # T2L_TaT1: 0.5
    # T2L_TaT3: 0.5
    # T2L_TaTip: 0.5
    # T2R_Tro: 2.0
    # T2R_FeTi: 1.0
    # T2R_TiTa: 1.0
    # T2R_TaT1: 0.5
    # T2R_TaT3: 0.5
    # T2R_TaTip: 0.5
    # T3L_Tro: 2.0
    # T3L_FeTi: 1.0
    # T3L_TiTa: 1.0
