  - tarsus2_T3_left
  - tarsus3_T3_left
  - tarsus4_T3_left
  - tarsal_claw_T3_left
  - coxa_T3_right
  - trochanter_T3_right
  - femur_T3_right
  - tibia_T3_right
  - tarsus1_T3_right
  - tarsus2_T3_right
  - tarsus3_T3_right
  - tarsus4_T3_right
  - tarsal_claw_T3_right

# All 56 verified as real XML joints. Head/antenna/mouthpart joints (14 -- the
# same block v1 drops, plus `haustellum_abduct` etc.) are DROPPED here too:
# neither model articulates the head. Unlike v1, T2/T3 legs here have only 1
# coxa DOF (extension) -- no coxa_abduct/coxa_twist -- and there is no
# femur_twist joint at all (a `trochanter_*` joint sits between coxa and
# femur instead). `haltere_left`/`haltere_right` are new in v2.3 (no v1
# equivalent) and are verified present.
joint_names:
  # Wing joints -- SAME SIX NAMES as v1, but at qposadr 21-26 here, not
  # 7-12. Never index qpos by a v1-shaped slice against this model.
  - wing_yaw_left
  - wing_roll_left
  - wing_pitch_left
  - wing_yaw_right
  - wing_roll_right
  - wing_pitch_right

  # Abdomen joints -- identical set and order to v1.
  - abdomen_abduct
  - abdomen
  - abdomen_abduct_2
  - abdomen_2
  - abdomen_abduct_3
  - abdomen_3
  - abdomen_abduct_4
  - abdomen_4
  - abdomen_abduct_5
  - abdomen_5
  - abdomen_abduct_6
  - abdomen_6
  - abdomen_abduct_7
  - abdomen_7

  # T1 leg joints -- front legs keep all 3 coxa DOFs (abduct/twist/extend)
  - coxa_abduct_T1_left
  - coxa_twist_T1_left
  - coxa_T1_left
  - trochanter_T1_left
  - femur_T1_left
  - tibia_T1_left
  - tarsus1_T1_left
  - coxa_abduct_T1_right
  - coxa_twist_T1_right
  - coxa_T1_right
  - trochanter_T1_right
  - femur_T1_right
  - tibia_T1_right
  - tarsus1_T1_right

  # T2 leg joints -- middle legs: coxa extension only (no abduct/twist)
  - coxa_T2_left
  - trochanter_T2_left
  - femur_T2_left
  - tibia_T2_left
  - tarsus1_T2_left
  - coxa_T2_right
  - trochanter_T2_right
  - femur_T2_right
  - tibia_T2_right
  - tarsus1_T2_right

  # T3 leg joints -- hind legs: coxa extension only (no abduct/twist)
  - coxa_T3_left
  - trochanter_T3_left
  - femur_T3_left
  - tibia_T3_left
  - tarsus1_T3_left
  - coxa_T3_right
  - trochanter_T3_right
  - femur_T3_right
  - tibia_T3_right
  - tarsus1_T3_right

  # Haltere joints -- new in v2.3, no v1 equivalent.
  - haltere_left
  - haltere_right

wing_names:
  # All 6 verified as real XML joints (same names as v1, different qposadr).
  - wing_yaw_left
  - wing_roll_left
  - wing_pitch_left
  - wing_yaw_right
  - wing_roll_right
  - wing_pitch_right

# ===========================================================================
# STAC model definition (ported from stac-mjx so the main configs are the
# single source of truth). Defines the keypoint<->body mapping and IK solver
# parameters Plan B's IK consumes. `model.KP_NAMES` (50) and
# `KEYPOINT_MODEL_PAIRS` (50 targets) verified 100% present against the
# compiled v2_3_ik model -- same 50 keypoint names as v1 (this fly's
# tracked-keypoint set does not change between body models), retargeted at
# v2_3's own body names (e.g. `T1L_TiTa: tarsus1_T1_left`, not v1's
# `tarsus_T1_left`).
# ===========================================================================
model:
  MJCF_PATH: ${anatomy.mjcf_path}
  name: 'fruitfly_V2_3'

  # OFF, AND IT STAYS OFF UNLESS SOMEONE TURNS IT ON DELIBERATELY -- same
  # decision and rationale as v1.yaml (see that file's much longer comment
  # for the full history, including the 2026-08-31 retraction of the "OFF is
  # better" verdict and why it is still void). Not re-litigated per anatomy.
  segment_calibration: false

  N_FRAMES_PER_CLIP: 500

  # Tolerance for the optimizations of the full model, limb, and root.
  FTOL: 5.0e-03
  ROOT_FTOL: 1.0e-05
  LIMB_FTOL: 1.0e-06

  # Number of alternating pose and offset optimization rounds.
  N_ITERS: 6
  N_ITER_Q: 500
  N_ITER_M: 2000

  KP_NAMES:
    - Scutellum
    - WingL_base
    - WingR_base
    - Antenna_Base
    - EyeL
    - EyeR
    - WingL_V12
    - WingL_V13
    - WingR_V12
    - WingR_V13
    - Abd_A4
    - Abd_tip
    - T1L_ThxCx
    - T1L_Tro
    - T1L_FeTi
    - T1L_TiTa
    - T1L_TaT1
    - T1L_TaT3
    - T1L_TaTip
    - T1R_ThxCx
    - T1R_Tro
    - T1R_FeTi
    - T1R_TiTa
    - T1R_TaT1
    - T1R_TaT3
    - T1R_TaTip
    - T2L_Tro
