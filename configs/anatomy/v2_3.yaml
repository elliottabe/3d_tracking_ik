  # Per-joint L2 regularization toward rest pose (q=0) applied during pose
  # optimization. Empty = no regularization -- no v2_3-specific measurement
  # has been done to justify a nonzero value (see v1.yaml's own comment for
  # why one was tried and reverted there).
  JOINT_REG_WEIGHTS: {}

  # Fixed step size for the ProjectedGradient q optimizer (see v1.yaml for
  # the rationale -- identical here).
  STEPSIZE_Q: 0.0

  # --- Jaxls batch Levenberg-Marquardt IK solver ---
  USE_JAXLS: True
  JAXLS_LAMBDA_INITIAL: 1.0
  JAXLS_GRADIENT_TOLERANCE: 1.0e-8
  JAXLS_PARAMETER_TOLERANCE: 1.0e-10
  JAXLS_COST_TOLERANCE: 1.0e-10
  JAXLS_SMOOTH_WEIGHT: 0.01
  JAXLS_LINEAR_SOLVER: "auto"
  JAXLS_USE_SE3_ROOT: true
  JAXLS_CHUNK_SIZE: 0
  JAXLS_ORIENTATION_KEYPOINTS:
    rear: Scutellum
    left: WingL_base
    right: WingR_base
    front: Antenna_Base

  KEYPOINT_WEIGHTS: {}
