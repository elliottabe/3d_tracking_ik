# Anatomy config for the v1 body model (`model/fruitfly_v1/`).
#
# DERIVED from the source repo's `configs/anatomy/v1.yaml`, intersected
# against the committed XML (`model/fruitfly_v1/fruitfly_v1_free.xml`) -- see
# `.superpowers/sdd/2026-09-10-foundation-detector-passes/
# anatomy-v1-verified-facts.md` for the verification (loaded with MuJoCo,
# every name list checked against the model's own bodies/joints/sites/geoms).
# Work from that document, not this file's history, if the two disagree.
#
# `model.KP_NAMES`, `model.KEYPOINT_MODEL_PAIRS`, `end_eff_names` and
# `wing_names` were verified 100% present in the XML and are copied as-is,
# together with the rest of the `model:` block (STAC/IK solver settings --
# Plan B's IK consumes these; brought now rather than re-derived later from
# the repo this one is severing from). `body_names`/`joint_names` are
# curated SUBSETS of the XML (not the full body/joint lists -- 20 XML
# bodies, abdomen segments among them, are absent by design) and were
# rebuilt here as the source list INTERSECTED with the XML; see the
# `# DROPPED` comments at each list for exactly what came out and why.
# `cse_mesh_npz` was dropped entirely: DensePose/CSE is an explicit spec
# non-goal.
name: v1

# Skeleton-structural default: keypoints excluded from the Procrustes
# alignment fit (glob patterns over keypoint names). Wing-vein markers
# (V12/V13) move too fast to be reliable for the rigid fit.
alignment_exclude: ["*_V12", "*_V13"]

# In-repo model root, so a bare clone works with no external config. `v2_3`
# (a different, external body-model checkout) instead sets `root` to that
# checkout's path and must run its `build_v2_3_ik_model.py` once per
# checkout to derive the model files under that root before `mjcf_path`/
# `arena_path` exist.
root: ${repo_root:}/model
mjcf_path: "${root}/fruitfly_v1/fruitfly_v1_free.xml"
arena_path: "${root}/fruitfly_v1/floor.xml"

end_eff_names:
  # V1 uses "claw" not "tarsal_claw". All 6 verified as real XML bodies.
  - claw_T1_left
  - claw_T1_right
  - claw_T2_left
  - claw_T2_right
  - claw_T3_left
  - claw_T3_right

# Curated subset of XML bodies (48 -- NOT the full 68). Source list (49) had
# ONE phantom, DROPPED here:
#   - trochanter_T1_left: not a body, joint, geom or site anywhere in the
#     XML. V1 has no trochanter body at all (confirmed: no XML body name
#     contains "trochanter"); T1L_Tro/T2L_Tro/... in KEYPOINT_MODEL_PAIRS
#     correctly map to the femur_T{1,2,3}_{left,right} bodies instead, which
#     is deliberate, not a bug -- do not "fix" that mapping.
